[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-calendar-local"
version = "1.5.0"
description = "A local terminal task calendar with independent desktop reminders"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
task = "taskcal.cli:main"

[tool.setuptools]
packages = ["taskcal"]
